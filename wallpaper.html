<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010103;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        window.customHour = null;

        // Exposed Console Controls
        window.setHour = function(hour) {
            if (hour >= 0 && hour <= 24) {
                window.customHour = hour;
                console.log(`%c 🔮 Generative timeline forced to ${hour}:00`, 'color: #c084fc; font-weight: bold;');
            } else {
                console.error("Enter a value between 0 and 24.");
            }
        };

        window.resetTime = function() {
            window.customHour = null;
            console.log("%c 🔄 Connected back to system clock.", "color: #34d399; font-weight: bold.");
        };

        function resize() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);

        // Highly Saturated Matte Dark Mode Themes (10 Slots Each)
        const themes = {
            t_12_19_am: { // Panel 7: Monochrome Midnight
                skyTop: '#111317', skyBottom: '#555a62',
                layers: ['#07080a', '#0d1013', '#16191f', '#222730', '#2d333f', '#3b4452', '#4c5666', '#606c80', '#7a899c', '#98a7bd']
            },
            t_4_47_am: { // Panel 6: Deep Teal Dawn
                skyTop: '#01161b', skyBottom: '#0ca1a6',
                layers: ['#000508', '#010f14', '#021c24', '#032c38', '#043e4f', '#065369', '#086b85', '#0a87a6', '#0dc4ed', '#38e5ff']
            },
            t_5_30_am: { // Panel 1: Soft Lavender Dawn
                skyTop: '#100b26', skyBottom: '#a77eb5',
                layers: ['#05020d', '#0b061c', '#150d30', '#221549', '#301d63', '#412982', '#5638a6', '#6f4acf', '#8c62fa', '#aa82ff']
            },
            t_5_45_am: { // Panel 3: Muted Twilight Dawn
                skyTop: '#0c1024', skyBottom: '#7c86a6',
                layers: ['#03050f', '#080c1f', '#101633', '#1b234d', '#28336b', '#38488f', '#4c60b5', '#657bd9', '#849eff', '#a8c2ff']
            },
            t_6_00_am: { // Panel 10: Lavender Pink Dawn
                skyTop: '#1d0f36', skyBottom: '#d68bb2',
                layers: ['#080314', '#110729', '#1f0d42', '#311561', '#471f87', '#622cae', '#823cde', '#a65eff', '#c984ff', '#ebb8ff']
            },
            t_7_10_am: { // Panel 12: Bright Morning Sunrise
                skyTop: '#1c2e4a', skyBottom: '#e0a996',
                layers: ['#09101c', '#111e33', '#1d304f', '#2c4770', '#3e6294', '#5380bf', '#6ca2eb', '#8dc4ff', '#b3daff', '#d9ecff']
            },
            t_12_40_pm: { // Panel 2: Warm Bright Day
                skyTop: '#152238', skyBottom: '#f59e42',
                layers: ['#080b12', '#121724', '#20273b', '#313b54', '#465373', '#5e7096', '#7b92ba', '#9cb8de', '#bfdfff', '#e6f2ff']
            },
            t_6_20_pm: { // Panel 9: Peak Golden Violet Sunset
                skyTop: '#240633', skyBottom: '#f7436b',
                layers: ['#0d0114', '#1a0326', '#2d063d', '#470b59', '#661285', '#8b20b0', '#b535db', '#e052ff', '#f085ff', '#ffb8ff']
            },
            t_7_00_pm: { // Panel 11: Purple Dusk
                skyTop: '#18042b', skyBottom: '#b63ec7',
                layers: ['#0a0114', '#140329', '#220642', '#340a61', '#4b118c', '#671db8', '#8a2de0', '#b042ff', '#d175ff', '#f3baff']
            },
            t_7_23_pm: { // Panel 8: Sage Green Dusk
                skyTop: '#111d15', skyBottom: '#6e9e7c',
                layers: ['#050a07', '#0a140e', '#12241a', '#1d3828', '#2a4f39', '#3a6b4e', '#4d8c67', '#63b082', '#7cd6a2', '#9effc4']
            },
            t_7_48_pm: { // Panel 5: Early Night Aurora / Aqua Dusk
                skyTop: '#020a1c', skyBottom: '#0ea5b8',
                layers: ['#01040d', '#03091a', '#071329', '#0d213d', '#153457', '#1f4b75', '#2c6796', '#3d87bd', '#53ace6', '#70d6ff']
            },
            t_9_32_pm: { // Panel 4: Deep Night Stars
                skyTop: '#010514', skyBottom: '#1d4885',
                layers: ['#000105', '#01040f', '#02091f', '#031133', '#051b4d', '#07276b', '#0a3691', '#0d4bb8', '#1467e3', '#3d8bff']
            }
        };

        function hexToRgb(hex) {
            return {
                r: parseInt(hex.substring(1, 3), 16),
                g: parseInt(hex.substring(3, 5), 16),
                b: parseInt(hex.substring(5, 7), 16)
            };
        }

        function lerpColor(c1, c2, f) {
            const rgb1 = hexToRgb(c1);
            const rgb2 = hexToRgb(c2);
            return `rgb(${Math.round(rgb1.r + f * (rgb2.r - rgb1.r))},${Math.round(rgb1.g + f * (rgb2.g - rgb1.g))},${Math.round(rgb1.b + f * (rgb2.b - rgb1.b))})`;
        }

        function getThemeForTime(hour) {
            const t = {
                m_12_19_am: 0.327,  m_4_47_am: 4.797,   m_5_30_am: 5.500,
                m_5_45_am: 5.750,   m_6_00_am: 6.000,   m_7_10_am: 7.170,
                m_12_40_pm: 12.680, m_6_20_pm: 18.347,  m_7_00_pm: 19.000,
                m_7_23_pm: 19.385,  m_7_48_pm: 19.800,  m_9_32_pm: 21.538
            };

            if (hour >= t.m_12_19_am && hour < t.m_4_47_am) {
                return interpolateThemes(themes.t_12_19_am, themes.t_4_47_am, (hour - t.m_12_19_am) / (t.m_4_47_am - t.m_12_19_am));
            } else if (hour >= t.m_4_47_am && hour < t.m_5_30_am) {
                return interpolateThemes(themes.t_4_47_am, themes.t_5_30_am, (hour - t.m_4_47_am) / (t.m_5_30_am - t.m_4_47_am));
            } else if (hour >= t.m_5_30_am && hour < t.m_5_45_am) {
                return interpolateThemes(themes.t_5_30_am, themes.t_5_45_am, (hour - t.m_5_30_am) / (t.m_5_45_am - t.m_5_30_am));
            } else if (hour >= t.m_5_45_am && hour < t.m_6_00_am) {
                return interpolateThemes(themes.t_5_45_am, themes.t_6_00_am, (hour - t.m_5_45_am) / (t.m_6_00_am - t.m_5_45_am));
            } else if (hour >= t.m_6_00_am && hour < t.m_7_10_am) {
                return interpolateThemes(themes.t_6_00_am, themes.t_7_10_am, (hour - t.m_6_00_am) / (t.m_7_10_am - t.m_6_00_am));
            } else if (hour >= t.m_7_10_am && hour < t.m_12_40_pm) {
                return interpolateThemes(themes.t_7_10_am, themes.t_12_40_pm, (hour - t.m_7_10_am) / (t.m_12_40_pm - t.m_7_10_am));
            } else if (hour >= t.m_12_40_pm && hour < t.m_6_20_pm) {
                return interpolateThemes(themes.t_12_40_pm, themes.t_6_20_pm, (hour - t.m_12_40_pm) / (t.m_6_20_pm - t.m_12_40_pm));
            } else if (hour >= t.m_6_20_pm && hour < t.m_7_00_pm) {
                return interpolateThemes(themes.t_6_20_pm, themes.t_7_00_pm, (hour - t.m_6_20_pm) / (t.m_7_00_pm - t.m_6_20_pm));
            } else if (hour >= t.m_7_00_pm && hour < t.m_7_23_pm) {
                return interpolateThemes(themes.t_7_00_pm, themes.t_7_23_pm, (hour - t.m_7_00_pm) / (t.m_7_23_pm - t.m_7_00_pm));
            } else if (hour >= t.m_7_23_pm && hour < t.m_7_48_pm) {
                return interpolateThemes(themes.t_7_23_pm, themes.t_7_48_pm, (hour - t.m_7_23_pm) / (t.m_7_48_pm - t.m_7_23_pm));
            } else if (hour >= t.m_7_48_pm && hour < t.m_9_32_pm) {
                return interpolateThemes(themes.t_7_48_pm, themes.t_9_32_pm, (hour - t.m_7_48_pm) / (t.m_9_32_pm - t.m_7_48_pm));
            } else {
                let f = 0;
                if (hour >= t.m_9_32_pm) {
                    f = (hour - t.m_9_32_pm) / ((24 - t.m_9_32_pm) + t.m_12_19_am);
                } else {
                    f = ((24 - t.m_9_32_pm) + hour) / ((24 - t.m_9_32_pm) + t.m_12_19_am);
                }
                return interpolateThemes(themes.t_9_32_pm, themes.t_12_19_am, f);
            }
        }

        function interpolateThemes(t1, t2, f) {
            let config = { skyTop: lerpColor(t1.skyTop, t2.skyTop, f), skyBottom: lerpColor(t1.skyBottom, t2.skyBottom, f), layers: [] };
            for (let i = 0; i < 10; i++) config.layers.push(lerpColor(t1.layers[i], t2.layers[i], f));
            return config;
        }

        // Configuration setup for exactly 10 smooth generative layers
        const layersConfig = Array.from({ length: 10 }, (_, i) => {
            const ratio = i / 9;
            return {
                baseHeight: 0.15 + ratio * 0.55, 
                amplitude: 35 + Math.random() * 20,
                freqA: 0.0020 + (1 - ratio) * 0.0015,
                freqB: 0.0035 + ratio * 0.0020,
                flowSpeed: (0.6 + ratio * 0.8) * (i % 2 === 0 ? 1 : -1)
            };
        });

        const stars = Array.from({ length: 35 }, () => ({
            x: Math.random(), y: Math.random() * 0.25,
            size: Math.random() * 1.3 + 0.4, speed: Math.random() * 0.008 + 0.004, phase: Math.random() * 10
        }));

        let timeTicker = 0;

        function render() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            let hour = window.customHour !== null ? window.customHour : 
                       (new Date().getHours() + new Date().getMinutes() / 60 + new Date().getSeconds() / 3600);

            const activeTheme = getThemeForTime(hour);
            timeTicker += 1.2; // Smooth streaming speed toggle

            // Render Backdrop Sky
            const sky = ctx.createLinearGradient(0, 0, 0, h);
            sky.addColorStop(0, activeTheme.skyTop);
            sky.addColorStop(1, activeTheme.skyBottom);
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, w, h);

            // Night sky stars
            let darkIntensity = 0;
            if (hour >= 19.5 || hour < 5) darkIntensity = 1;
            else if (hour >= 16.5 && hour < 19.5) darkIntensity = (hour - 16.5) / 3;
            else if (hour >= 5 && hour < 7) darkIntensity = 1 - ((hour - 5) / 2);

            if (darkIntensity > 0) {
                ctx.save();
                ctx.globalAlpha = darkIntensity;
                stars.forEach(s => {
                    let opacity = 0.15 + (Math.sin(timeTicker * s.speed + s.phase) + 1) * 0.4;
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.beginPath();
                    ctx.arc(s.x * w, s.y * h, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            // Render the 7 front waves (skipping the first 3 background slots)
            for (let i = 3; i < 10; i++) {
                const layer = layersConfig[i];
                
                ctx.beginPath();
                ctx.moveTo(0, h);
                
                let initialY = h * layer.baseHeight;
                ctx.lineTo(0, initialY);

                for (let x = 0; x <= w; x += 4) {
                    // FIXED: Removed the arching sine multiplier from pathBase completely. 
                    // The path is now a perfectly flat, level base line from left to right.
                    let pathBase = initialY;
                    
                    let flowX = x + (timeTicker * layer.flowSpeed);
                    
                    let waveComponentA = Math.sin(flowX * layer.freqA);
                    let waveComponentB = Math.cos(flowX * layer.freqB + i);
                    
                    let combinedGeometry = (waveComponentA * 0.60 + waveComponentB * 0.40) * layer.amplitude;
                    
                    ctx.lineTo(x, pathBase + combinedGeometry);
                }

                ctx.lineTo(w, h);
                ctx.closePath();

                // Paint with deep, fully vibrant solid color configurations
                ctx.fillStyle = activeTheme.layers[i];
                ctx.fill();

                // Structural depth blend shadows to cleanly separate the solid layers
                ctx.save();
                ctx.globalCompositeOperation = 'source-atop';
                let shadowGrad = ctx.createLinearGradient(0, h * (layer.baseHeight - 0.05), 0, h);
                shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.0)');
                shadowGrad.addColorStop(0.12, 'rgba(0, 0, 0, 0.22)'); 
                shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0.70)');
                ctx.fillStyle = shadowGrad;
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        resize();
        requestAnimationFrame(render);
    </script>
</body>
</html>
